name: CI — SGE Fortal Backend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm ci

      - name: Build TypeScript (NestJS)
        working-directory: backend
        run: npm run build

      - name: Executar testes unitários
        working-directory: backend
        run: npm run test -- --passWithNoTests --forceExit

  backend-e2e:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    # NOTA (ADR-0008/0009): O CI usa o mecanismo nativo de 'services' do GitHub Actions
    # para subir o banco de dados efêmero, em vez de usar o docker-compose.e2e.yml (usado localmente pelo script run-e2e.ts).
    # Esta divergência é intencional e aceitável, pois evita overhead de Docker-in-Docker e é o padrão recomendado para CI.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sge_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run Prisma Migrations
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Run E2E Tests
        working-directory: backend
        run: npm run test:e2e
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/sge_e2e?schema=public
      JWT_SECRET: ci-test-secret
      ALLOWED_ORIGINS: http://localhost:3001
      SEED_ADMIN_PASSWORD: ci-seed-password
      CI: true

  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Tests
        working-directory: frontend
        run: npm test -- --passWithNoTests
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://test

  docker-smoke:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Image
        run: docker build -t backend:ci ./backend
      - name: Build Frontend Image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=http://test -t frontend:ci ./frontend
