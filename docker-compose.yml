version: '3.8'

services:
  db:
    image: postgres:15
    container_name: fortal_sge_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: fortal_sge
    ports:
      - "5433:5432"
    volumes:
      - fortal_sge_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: fortal_sge_redis
    ports:
      - "6379:6379"
    volumes:
      - fortal_sge_redis:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  fortal_sge_data:
  fortal_sge_redis:
